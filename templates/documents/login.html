<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход — PDF Data Base</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
<style>
  * { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
  body {
    background: #f5f5f7;
    color: #1d1d1f;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .login-card {
    width: 100%;
    max-width: 380px;
    background: #fff;
    border: none;
    border-radius: 20px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.04);
    padding: 48px 40px;
    text-align: center;
  }
  .brand {
    font-size: 24px;
    font-weight: 600;
    letter-spacing: -0.021em;
    color: #1d1d1f;
    margin-bottom: 8px;
  }
  .subtitle {
    font-size: 15px;
    color: #6e6e73;
    margin-bottom: 32px;
  }
  .form-control {
    border: 1px solid rgba(0,0,0,0.08);
    border-radius: 12px;
    padding: 12px 16px;
    font-size: 15px;
    background: #fff;
    height: auto;
    transition: all 0.2s ease;
  }
  .form-control:focus {
    border-color: #0071e3;
    box-shadow: 0 0 0 4px rgba(0,113,227,0.15);
  }
  .form-label {
    font-size: 13px;
    font-weight: 500;
    color: #6e6e73;
    margin-bottom: 6px;
    text-align: left;
    display: block;
  }
  .btn-login {
    border-radius: 980px;
    padding: 12px;
    font-size: 15px;
    font-weight: 500;
    background: #0071e3;
    border: none;
    width: 100%;
    transition: all 0.2s ease;
  }
  .btn-login:hover { background: #0077ed; transform: scale(1.02); }
  .alert {
    border: none;
    border-radius: 12px;
    font-size: 13px;
    text-align: left;
  }
  .alert-danger { background: #ffe5e5; color: #b00020; }
</style>
</head>
<body>
<div class="login-card">
  <div class="brand"><i class="bi bi-file-pdf-fill text-danger me-2"></i>PDF Data Base</div>
  <div class="subtitle">Вход в систему</div>

  {% if form.errors %}
  <div class="alert alert-danger py-2 mb-3"><i class="bi bi-exclamation-triangle me-2"></i>Неверный логин или пароль</div>
  {% endif %}

  <form method="post" action="{% url 'login' %}">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    <div class="mb-3 text-start">
      <label class="form-label">Имя пользователя</label>
      <input type="text" name="username" class="form-control" placeholder="Введите логин" required autofocus>
    </div>
    <div class="mb-4 text-start">
      <label class="form-label">Пароль</label>
      <input type="password" name="password" class="form-control" placeholder="Введите пароль" required>
    </div>
    <button type="submit" class="btn btn-primary btn-login"><i class="bi bi-box-arrow-in-right me-2"></i>Войти</button>
  </form>

  <div class="mt-4 text-muted" style="font-size:13px;">
    Нет аккаунта? Обратитесь к администратору.
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

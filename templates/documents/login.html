<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход — PDF Менеджер</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
<style>
  body { background: #f0f2f5; min-height:100vh; display:flex; align-items:center; justify-content:center; }
  .login-card { width:100%; max-width:400px; border:none; border-radius:16px; box-shadow:0 10px 40px rgba(0,0,0,0.10); padding:2.5rem; }
  .brand { color:#1a1a2e; font-weight:700; font-size:1.4rem; text-align:center; margin-bottom:2rem; }
  .form-control { border-radius:10px; padding:0.75rem 1rem; }
  .btn-login { border-radius:10px; padding:0.75rem; font-weight:600; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); border:none; }
  .btn-login:hover { opacity:0.9; }
</style>
</head>
<body>
<div class="login-card bg-white">
  <div class="brand"><i class="bi bi-file-pdf-fill text-danger me-2"></i>PDF Менеджер</div>
  <h5 class="text-center mb-4 text-muted">Вход в систему</h5>

  {% if form.errors %}
  <div class="alert alert-danger py-2"><i class="bi bi-exclamation-triangle me-2"></i>Неверный логин или пароль</div>
  {% endif %}

  <form method="post" action="{% url 'login' %}">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    <div class="mb-3">
      <label class="form-label small fw-medium text-muted">Имя пользователя</label>
      <input type="text" name="username" class="form-control" placeholder="Введите логин" required autofocus>
    </div>
    <div class="mb-4">
      <label class="form-label small fw-medium text-muted">Пароль</label>
      <input type="password" name="password" class="form-control" placeholder="Введите пароль" required>
    </div>
    <button type="submit" class="btn btn-primary btn-login w-100"><i class="bi bi-box-arrow-in-right me-2"></i>Войти</button>
  </form>

  <div class="text-center mt-4 text-muted small">
    <p class="mb-1">Нет аккаунта? Обратитесь к администратору.</p>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

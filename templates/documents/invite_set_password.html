{% load i18n %}
{% get_current_language as LANGUAGE_CODE %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE|slice:':2' }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% trans "Установка пароля — PDF Data Base" %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
<style>
  body { background: #f5f5f7; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .card { max-width: 400px; width: 100%; border: none; border-radius: 20px; box-shadow: 0 4px 24px rgba(0,0,0,0.04); padding: 40px; }
  .language-switcher-wrap { margin-bottom: 16px; }
</style>
</head>
<body>
<div class="card">
  <h4 class="fw-bold mb-1">{% trans "Установка пароля" %}</h4>
  <p class="text-muted mb-4">{{ email }}</p>
  {% if messages %}
  {% for msg in messages %}
  <div class="alert alert-danger py-2">{{ msg }}</div>
  {% endfor %}
  {% endif %}
  <form method="post">
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label">{% trans "Новый пароль" %}</label>
      <input type="password" name="password" class="form-control" minlength="8" required autofocus>
    </div>
    <div class="mb-4">
      <label class="form-label">{% trans "Повторите пароль" %}</label>
      <input type="password" name="password2" class="form-control" minlength="8" required>
    </div>
    <div class="language-switcher-wrap">
      {% include 'partials/language_switcher.html' %}
    </div>
    <button type="submit" class="btn btn-primary w-100">{% trans "Сохранить и войти" %}</button>
  </form>
</div>
</body>
</html>

{% extends 'base.html' %}
{% block title %}{{ title }} — PDF Data Base{% endblock %}
{% block content %}
<div class="d-flex align-items-center mb-4">
  <a href="{% url 'category_list' %}" class="btn btn-outline-secondary btn-sm me-3"><i class="bi bi-arrow-left"></i></a>
  <h4 class="fw-bold mb-0">{{ title }}</h4>
</div>
<div class="card p-4" style="max-width:500px">
  <form method="post">{% csrf_token %}
    {% include 'documents/_form_errors.html' %}
    <div class="mb-3"><label class="form-label fw-medium">Название *</label>{{ form.name }}</div>
    <div class="mb-3"><label class="form-label fw-medium">Описание</label>{{ form.description }}</div>
    <button type="submit" class="btn btn-primary px-4"><i class="bi bi-check-lg me-2"></i>Сохранить</button>
    <a href="{% url 'category_list' %}" class="btn btn-outline-secondary ms-2">Отмена</a>
  </form>
</div>
{% endblock %}

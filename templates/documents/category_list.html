{% extends 'base.html' %}
{% block title %}Категории{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h4 class="fw-bold mb-0"><i class="bi bi-folder2 me-2 text-warning"></i>Категории</h4>
  <a href="/categories/create/" class="btn btn-primary"><i class="bi bi-plus me-1"></i>Создать</a>
</div>
<div class="row g-3">
{% for cat in categories %}
<div class="col-md-4"><div class="card p-3 h-100"><div class="d-flex justify-content-between align-items-start"><div><h6 class="fw-bold">{{ cat.name }}</h6><p class="text-muted small mb-0">{{ cat.description|default:"Нет описания" }}</p></div><span class="badge bg-primary rounded-pill fs-6">{{ cat.doc_count }}</span></div><div class="mt-2 text-muted small">документов</div></div></div>
{% empty %}<div class="col-12"><div class="text-center py-5 text-muted"><i class="bi bi-folder2 fs-1 d-block mb-2"></i>Нет категорий. <a href="/categories/create/">Создать первую</a></div></div>{% endfor %}
</div>
{% endblock %}

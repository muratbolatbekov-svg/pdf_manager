{% extends 'base.html' %}
{% block title %}Удалить документ — PDF Data Base{% endblock %}
{% block content %}
<div class="card p-4" style="max-width:500px;margin:auto">
  <div class="text-center mb-4">
    <i class="bi bi-exclamation-triangle text-danger" style="font-size:3rem;"></i>
  </div>
  <h5 class="fw-bold mb-3 text-center">Удалить документ?</h5>
  <p class="text-center text-muted">Вы уверены, что хотите удалить <strong>{{ document.title }}</strong>? Это действие нельзя отменить.</p>
  <form method="post" class="text-center">{% csrf_token %}
    <button type="submit" class="btn btn-danger px-4 me-2"><i class="bi bi-trash me-1"></i>Удалить</button>
    <a href="{% url 'document_detail' document.slug %}" class="btn btn-outline-secondary">Отмена</a>
  </form>
</div>
{% endblock %}

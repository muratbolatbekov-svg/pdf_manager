{% load i18n %}
{% if form.non_field_errors %}
<div class="alert alert-danger">
  {% for error in form.non_field_errors %}<div>{{ error }}</div>{% endfor %}
</div>
{% endif %}
{% for field in form %}
  {% if field.errors %}
  <div class="text-danger small mb-2">{{ field.label }}: {{ field.errors|striptags }}</div>
  {% endif %}
{% endfor %}

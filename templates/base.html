<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}PDF Менеджер{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
<style>
  body { background: #f0f2f5; }
  .sidebar { min-height: 100vh; background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%); }
  .sidebar .nav-link { color: #a0aec0; border-radius: 8px; margin: 2px 0; }
  .sidebar .nav-link:hover, .sidebar .nav-link.active { background: rgba(99,102,241,0.2); color: #fff; }
  .sidebar .brand { color: #fff; font-weight: 700; font-size: 1.2rem; }
  .card { border: none; border-radius: 12px; box-shadow: 0 1px 8px rgba(0,0,0,0.07); }
  .stat-card { border-left: 4px solid; }
  .badge-status-active { background: #d1fae5; color: #065f46; }
  .badge-status-archived { background: #f3f4f6; color: #374151; }
  .badge-status-draft { background: #fef3c7; color: #92400e; }
  .user-badge { background: rgba(255,255,255,0.1); color: #fff; border-radius: 8px; padding: 0.5rem 0.75rem; font-size: 0.85rem; }
</style>
</head>
<body>
<div class="container-fluid">
<div class="row">
  <nav class="col-md-2 sidebar p-3 d-flex flex-column">
    <div class="brand mb-4 ps-2"><i class="bi bi-file-pdf-fill text-danger me-2"></i>PDF Менеджер</div>
    <ul class="nav flex-column flex-grow-1">
      <li class="nav-item"><a class="nav-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}" href="/"><i class="bi bi-speedometer2 me-2"></i>Дашборд</a></li>
      <li class="nav-item"><a class="nav-link {% if 'document' in request.resolver_match.url_name %}active{% endif %}" href="/documents/"><i class="bi bi-files me-2"></i>Документы</a></li>
      <li class="nav-item"><a class="nav-link {% if 'category' in request.resolver_match.url_name %}active{% endif %}" href="/categories/"><i class="bi bi-folder2 me-2"></i>Категории</a></li>
      <li class="nav-item mt-3"><a class="nav-link" href="/documents/create/"><i class="bi bi-plus-circle me-2"></i>Добавить документ</a></li>
    </ul>
    <div class="mt-auto pt-3 border-top border-secondary">
      <div class="d-flex align-items-center justify-content-between">
        <span class="user-badge"><i class="bi bi-person-circle me-1"></i>{{ request.user.username }}</span>
        <a href="{% url 'logout' %}" class="btn btn-sm btn-outline-light border-0" title="Выйти"><i class="bi bi-box-arrow-right"></i></a>
      </div>
    </div>
  </nav>
  <main class="col-md-10 p-4">
    {% if messages %}{% for msg in messages %}<div class="alert alert-success alert-dismissible fade show"><i class="bi bi-check-circle me-2"></i>{{ msg }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>{% endfor %}{% endif %}
    {% block content %}{% endblock %}
  </main>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

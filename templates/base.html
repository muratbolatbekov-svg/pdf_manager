<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}PDF Data Base{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
<style>
  :root {
    --apple-bg: #f5f5f7;
    --apple-card: #ffffff;
    --apple-text: #1d1d1f;
    --apple-muted: #6e6e73;
    --apple-blue: #0071e3;
    --apple-blue-hover: #0077ed;
    --apple-border: rgba(0,0,0,0.08);
    --apple-shadow: 0 4px 24px rgba(0,0,0,0.04);
    --apple-radius: 18px;
  }
  * { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
  body {
    background: var(--apple-bg);
    color: var(--apple-text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 14px;
    line-height: 1.47059;
    letter-spacing: -0.022em;
  }
  /* Sidebar */
  .sidebar {
    width: 260px;
    min-height: 100vh;
    background: rgba(255,255,255,0.72);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-right: 1px solid var(--apple-border);
    position: fixed;
    left: 0; top: 0; bottom: 0;
    display: flex;
    flex-direction: column;
    padding: 24px 16px;
    z-index: 100;
  }
  .sidebar .brand {
    font-size: 21px;
    font-weight: 600;
    letter-spacing: -0.021em;
    color: var(--apple-text);
    margin-bottom: 32px;
    padding: 0 8px;
  }
  .sidebar .nav-link {
    color: var(--apple-muted);
    border-radius: 10px;
    padding: 10px 12px;
    margin: 2px 0;
    font-size: 14px;
    font-weight: 400;
    transition: all 0.2s ease;
  }
  .sidebar .nav-link:hover {
    color: var(--apple-text);
    background: rgba(0,0,0,0.04);
  }
  .sidebar .nav-link.active {
    color: var(--apple-text);
    background: rgba(0,0,0,0.06);
    font-weight: 500;
  }
  .sidebar .nav-link i { font-size: 17px; margin-right: 10px; opacity: 0.8; }
  .user-badge {
    background: rgba(0,0,0,0.04);
    color: var(--apple-text);
    border-radius: 10px;
    padding: 8px 12px;
    font-size: 13px;
    font-weight: 500;
  }
  /* Main */
  main {
    margin-left: 260px;
    padding: 40px 48px;
    min-height: 100vh;
  }
  /* Cards */
  .card {
    background: var(--apple-card);
    border: none;
    border-radius: var(--apple-radius);
    box-shadow: var(--apple-shadow);
  }
  .stat-card { padding: 24px; }
  .stat-label {
    font-size: 13px;
    color: var(--apple-muted);
    font-weight: 400;
    margin-bottom: 4px;
  }
  .stat-value {
    font-size: 32px;
    font-weight: 600;
    letter-spacing: -0.021em;
    color: var(--apple-text);
  }
  /* Buttons */
  .btn-primary {
    background: var(--apple-blue);
    border: none;
    border-radius: 980px;
    padding: 8px 20px;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: -0.01em;
    transition: all 0.2s ease;
  }
  .btn-primary:hover { background: var(--apple-blue-hover); transform: scale(1.02); }
  .btn-outline-secondary {
    border: 1px solid var(--apple-border);
    color: var(--apple-text);
    border-radius: 980px;
    font-size: 14px;
    font-weight: 400;
  }
  .btn-outline-secondary:hover { background: rgba(0,0,0,0.04); border-color: rgba(0,0,0,0.12); }
  .btn-outline-danger {
    border: 1px solid rgba(255,59,48,0.2);
    color: #ff3b30;
    border-radius: 980px;
  }
  .btn-outline-danger:hover { background: rgba(255,59,48,0.06); }
  .btn-outline-success {
    border: 1px solid rgba(52,199,89,0.25);
    color: #34c759;
    border-radius: 980px;
  }
  /* Badges */
  .badge-status-active { background: #d2f4df; color: #1d6f42; font-weight: 500; border-radius: 100px; padding: 4px 12px; font-size: 12px; }
  .badge-status-archived { background: #f2f2f7; color: var(--apple-muted); font-weight: 500; border-radius: 100px; padding: 4px 12px; font-size: 12px; }
  .badge-status-draft { background: #fff4d1; color: #9a6b00; font-weight: 500; border-radius: 100px; padding: 4px 12px; font-size: 12px; }
  /* Table */
  .table { font-size: 14px; }
  .table thead th {
    border: none;
    color: var(--apple-muted);
    font-weight: 500;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 16px;
  }
  .table tbody td {
    border: none;
    padding: 14px 16px;
    border-bottom: 1px solid var(--apple-border);
    vertical-align: middle;
  }
  .table tbody tr:last-child td { border-bottom: none; }
  .table tbody tr { transition: background 0.15s; }
  .table tbody tr:hover { background: rgba(0,0,0,0.015); }
  /* Form */
  .form-control, .form-select {
    border: 1px solid var(--apple-border);
    border-radius: 12px;
    padding: 10px 14px;
    font-size: 14px;
    background: #fff;
    transition: all 0.2s ease;
  }
  .form-control:focus, .form-select:focus {
    border-color: var(--apple-blue);
    box-shadow: 0 0 0 4px rgba(0,113,227,0.15);
  }
  /* Headings */
  h4, h5, h6 { letter-spacing: -0.021em; font-weight: 600; }
  /* Alerts */
  .alert {
    border: none;
    border-radius: 14px;
    font-size: 14px;
  }
  .alert-success { background: #d2f4df; color: #1d6f42; }
  /* Scrollbar Apple style */
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.25); }
</style>
</head>
<body>
<div class="sidebar">
  <div class="brand"><i class="bi bi-file-pdf-fill text-danger me-2"></i>PDF Data Base</div>
  <ul class="nav flex-column flex-grow-1">
    <li class="nav-item"><a class="nav-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}" href="/"><i class="bi bi-speedometer2"></i>Дашборд</a></li>
    <li class="nav-item"><a class="nav-link {% if 'document' in request.resolver_match.url_name %}active{% endif %}" href="/documents/"><i class="bi bi-files"></i>Документы</a></li>
    <li class="nav-item"><a class="nav-link {% if 'category' in request.resolver_match.url_name %}active{% endif %}" href="/categories/"><i class="bi bi-folder2"></i>Категории</a></li>
    <li class="nav-item mt-3"><a class="nav-link" href="/documents/create/"><i class="bi bi-plus-circle"></i>Добавить документ</a></li>
  </ul>
  <div class="mt-auto pt-3 border-top" style="border-color: var(--apple-border) !important;">
    <div class="d-flex align-items-center justify-content-between">
      <span class="user-badge"><i class="bi bi-person-circle me-1"></i>{{ request.user.username }}</span>
      <a href="{% url 'logout' %}" class="btn btn-sm btn-outline-secondary border-0" title="Выйти"><i class="bi bi-box-arrow-right"></i></a>
    </div>
  </div>
</div>
<main>
  {% if messages %}{% for msg in messages %}<div class="alert alert-success alert-dismissible fade show"><i class="bi bi-check-circle me-2"></i>{{ msg }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>{% endfor %}{% endif %}
  {% block content %}{% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
